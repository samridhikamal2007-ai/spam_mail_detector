<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spam Detector</title>
  </head>
  <body>
    <h1>Spam Detector</h1>
    <form id="f">
      <textarea name="text" id="text" rows="6" cols="60" placeholder="Paste message here"></textarea>
      <br/>
      <button type="submit">Check</button>
    </form>
    <div id="out"></div>
    <script>
      const form = document.getElementById('f');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const text = document.getElementById('text').value;
        const res = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
        const j = await res.json();
        if (j.error) document.getElementById('out').innerText = j.error;
        else document.getElementById('out').innerText = `Label: ${j.label}  Prob: ${j.probability}`;
      }
    </script>
  </body>
</html>
