name: Deploy to Heroku
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Heroku secrets
        run: |
          if [ -z "${{ secrets.HEROKU_API_KEY }}" ] || [ -z "${{ secrets.HEROKU_EMAIL }}" ]; then
            echo "Required Heroku secrets are missing. Set HEROKU_API_KEY and HEROKU_EMAIL in repository secrets.";
            exit 1;
          fi
          if [ -z "${{ secrets.HEROKU_APP_NAME }}" ]; then
            echo "Warning: HEROKU_APP_NAME is not set. The workflow will attempt to create an app automatically."
          fi
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
